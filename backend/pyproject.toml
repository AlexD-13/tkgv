[project]
name = "backend"
version = "0.1.0"
description = "FastAPI service for the Thanksgiving dinner dish management platform (GestionPlatos)"
readme = "README.md"
authors = [
    { name = "Luis Arroyo", email = "larroyob.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.163.1",
    "python-decouple>=3.8",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
